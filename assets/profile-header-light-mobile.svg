<svg xmlns="http://www.w3.org/2000/svg" width="360" height="272" viewBox="0 0 360 272" role="img" aria-labelledby="title desc">
  <title id="title">Rajdeep Pandey</title>
  <desc id="desc">I founded Milnr AI Labs and build AI products around persistent memory and agents that work together.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#eaf0f8"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="359" height="271" rx="20" fill="url(#surface)" stroke="#e1e5eb"/>
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="180" y="77" fill="#1d1d1f" font-size="37" font-weight="650" letter-spacing="-1.2">Rajdeep Pandey</text>
    <text fill="#535a65" font-size="18" font-weight="400">
      <tspan x="180" y="124">I founded <tspan fill="#1d1d1f" font-weight="600">Milnr AI Labs</tspan> and build</tspan>
      <tspan x="180" y="151">AI products around persistent</tspan>
      <tspan x="180" y="178">memory and agents that work</tspan>
      <tspan x="180" y="205">together.</tspan>
    </text>
  </g>
</svg>
